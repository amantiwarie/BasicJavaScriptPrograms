<!DOCTYPE html>
<html>
<head>
    <title>jQuery Todo List</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 400px;
            margin: 40px auto;
        }

        input {
            width: 250px;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            margin-top: 5px;
            background: #f4f4f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px 8px;
        }
    </style>
</head>
<body>

<h2>Todo List</h2>

<input type="text" id="taskInput" placeholder="Enter task">
<button id="addBtn">Add Task</button>
<p>Total Tasks: <span id="taskCount">0</span></p>

<ul id="taskList"></ul>
<script src ="script.js"></script>
</body>
</html>
